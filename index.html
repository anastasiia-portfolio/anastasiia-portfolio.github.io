<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* VOICE a creator's showreel: rich, warm, editorial
   IDEA a film strip of her real reels you scroll sideways, vertical first, then horizontal
   PICTURE three real reel frames fanned in the hero; the carousel is the main body of the page
   COLOUR Sceptre Red #4D0E12 ground, Transparent Yellow #F5EFC6 text, Cerulean #A5BCD6 for details
   TYPE Morganite (display; Oswald fills in Cyrillic) + Involve (text)
   LAYOUT laptop: name and lead left, fanned frames right; phone: name, frames, buttons */
@font-face{font-family:Morganite;src:url(fonts/Morganite-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:Morganite;src:url(fonts/Morganite-SemiBold.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Involve;src:url(fonts/Involve-VF.ttf) format("truetype");font-weight:400 700;font-display:swap}
:root{color-scheme:dark;--bg:#4d0e12;--bg2:#5c1419;--bg3:#3d0a0d;--ink:#f5efc6;--soft:#f5efc6b3;--blue:#a5bcd6;--line:#f5efc62e}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Involve,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Morganite,Oswald,Impact,sans-serif;font-weight:700;line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance;letter-spacing:.03em}
h2{font-size:clamp(56px,8vw,104px)}
h3{font-size:34px;font-weight:600;line-height:1}
:lang(ru) h1,:lang(ru) h2,:lang(ru) h3,:lang(ru) .role,:lang(ru) .logo,:lang(ru) .fact b,:lang(ru) .clist b,:lang(ru) .dream{font-family:Oswald,Impact,sans-serif;font-weight:600;letter-spacing:-.035em;line-height:1}
:lang(ru) h2{font-size:clamp(38px,5vw,64px)}
:lang(ru) .logo{font-size:22px;letter-spacing:.06em}
:lang(ru) .fact b{font-size:clamp(36px,3.8vw,52px)}
:lang(ru) .clist b{font-size:20px}
:lang(ru) h3{font-size:24px}
a{color:inherit}
img,video{max-width:100%;display:block}
.wrap{max-width:1240px;margin:0 auto}
.band{padding-block:clamp(44px,6vw,96px);padding-inline:max(5vw,16px)}
nav{position:sticky;top:0;z-index:5;background:var(--bg3);border-bottom:1px solid var(--line);padding:10px max(5vw,16px)}
nav .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font:700 32px/1 Morganite,Oswald,sans-serif;text-transform:uppercase;text-decoration:none;margin-right:auto;letter-spacing:.04em}
.links{display:flex;gap:20px;flex-wrap:wrap}
.links a{text-decoration:none;font-weight:500}
.links a:hover{color:var(--blue)}
.langs{display:flex;border:1.5px solid var(--blue);border-radius:99px;overflow:hidden}
.langs button{all:unset;cursor:pointer;padding:6px 13px;min-height:32px;font-weight:600;font-size:14px;display:flex;align-items:center;color:var(--blue)}
.langs button[aria-pressed=true]{background:var(--blue);color:var(--bg)}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero h1{font-size:clamp(110px,17vw,230px);line-height:.9;letter-spacing:.02em}
:lang(ru) .hero h1{font-size:clamp(54px,8vw,112px);line-height:1;letter-spacing:.04em}
.role{font:600 clamp(34px,3.4vw,44px)/1 Morganite,Oswald,sans-serif;text-transform:uppercase;color:var(--blue);margin-top:16px;letter-spacing:.04em}
:lang(ru) .role{font-size:clamp(20px,2.2vw,28px)}
.lead{font-size:18px;max-width:30em;margin:22px 0 26px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 24px;border-radius:99px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink)}
.btn.fill{background:var(--ink);color:var(--bg)}
.btn:hover{border-color:var(--blue)}
.btn.fill:hover{background:var(--blue);color:var(--bg)}
.fan{position:relative;height:min(560px,62vw);min-height:360px}
.fan img{position:absolute;top:50%;left:50%;width:42%;aspect-ratio:9/16;object-fit:cover;border-radius:20px;border:1.5px solid var(--blue);background:var(--bg2);box-shadow:0 18px 40px #0006}
.fan img:nth-child(1){transform:translate(-118%,-46%) rotate(-7deg)}
.fan img:nth-child(2){transform:translate(-50%,-52%);z-index:2;width:46%}
.fan img:nth-child(3){transform:translate(18%,-46%) rotate(7deg)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line);background:var(--bg3)}
.fact{padding:22px max(2.5vw,16px);border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font:700 clamp(50px,5.4vw,76px)/1 Morganite,Oswald,sans-serif;color:var(--blue);white-space:nowrap;letter-spacing:.03em}
.fact span{display:block;margin-top:10px;color:var(--soft);font-size:15px;line-height:1.4}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap}
.fmt{margin-top:40px}
.fmt+.fmt{margin-top:56px}
.fmt h3{color:var(--blue);font-size:clamp(30px,3vw,40px)}
:lang(ru) .fmt h3{font-size:clamp(22px,2.2vw,28px)}
.dream{margin-top:56px;padding-top:40px;border-top:1px solid var(--line);font:700 clamp(54px,7vw,96px)/1.05 Morganite,Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance;color:var(--blue)}
:lang(ru) .dream{font-size:clamp(34px,4.4vw,58px)}
.dream span{color:var(--ink)}
.arrows{display:flex;gap:10px}
.arrows button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--blue);color:var(--blue);display:grid;place-items:center}
.arrows button:hover{background:var(--blue);color:var(--bg)}
.arrows button:disabled{opacity:.3;cursor:default;background:none;color:var(--blue)}
.arrows svg{width:22px;height:22px}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:22px;padding-bottom:14px;scrollbar-width:thin;scrollbar-color:var(--blue) transparent;overscroll-behavior-x:contain}
.item{flex:none;scroll-snap-align:start;margin:0}
.item .frame{position:relative;height:clamp(380px,52vw,560px);border-radius:18px;overflow:hidden;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
.item.v .frame{aspect-ratio:9/16}
.item.h .frame{aspect-ratio:16/9;height:auto;width:min(86vw,calc(clamp(380px,52vw,560px)*16/9))}
.item.h{align-self:center}
.frame video{width:100%;height:100%;object-fit:cover}
.snd{position:absolute;right:10px;top:10px;background:#3d0a0dcc;color:var(--ink);border-radius:99px;font-size:13px;font-weight:600;padding:4px 10px;pointer-events:none}
.item figcaption{margin-top:10px;font-size:14px;font-weight:600;color:var(--blue)}
.item figcaption span{color:var(--soft);font-weight:400}
.cases{display:grid;gap:16px;margin-top:48px}
.case{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr) minmax(0,1.1fr);gap:28px;padding:28px 0;border-top:1px solid var(--line)}
.case .who{font-size:15px;color:var(--blue);margin-top:8px}
.case p{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tags span{font-size:13px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--blue);color:var(--blue)}
.res{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.res li{padding-left:20px;position:relative}
.res li::before{content:"";position:absolute;left:0;top:.62em;width:9px;height:2px;background:var(--blue)}
.svc{background:var(--bg3)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:36px}
.tile{border-radius:20px;padding:24px;border:1px solid var(--line);background:var(--bg)}
.tile h3{margin-bottom:12px;color:var(--blue)}
.tile p{margin:0;color:var(--soft)}
.about{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:start}
.about p{margin:18px 0 0;max-width:36em}
.rules{border:1px solid var(--blue);border-radius:22px;padding:28px}
.rules h3{margin-bottom:16px}
.contact{background:var(--ink);color:var(--bg)}
.contact .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.contact p{margin:14px 0 0;max-width:30em}
.clist{display:grid;gap:10px}
.clist a{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;min-height:58px;padding:12px 22px;border-radius:16px;text-decoration:none;border:1.5px solid var(--bg)}
.clist a:hover{background:var(--bg);color:var(--ink)}
.clist b{font:700 26px/1 Morganite,Oswald,sans-serif;text-transform:uppercase;letter-spacing:.05em}
.clist span{overflow-wrap:anywhere}
footer{padding:22px max(5vw,16px);font-size:14px;color:var(--soft);background:var(--bg3)}
@media(max-width:1000px){.case{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}.case .res{grid-column:2}}
@media(max-width:760px){.hero .wrap,.about,.contact .wrap{grid-template-columns:minmax(0,1fr)}.fan{height:auto;min-height:0;aspect-ratio:1.15}.facts{grid-template-columns:minmax(0,1fr)}.fact{border-right:0;border-bottom:1px solid var(--line)}.fact:last-child{border-bottom:0}.links{display:none}}
@media(max-width:600px){.case{grid-template-columns:minmax(0,1fr)}.case .res{grid-column:auto}.item .frame{height:min(480px,110vw)}.item.h .frame{height:auto;width:86vw}.arrows button{width:46px;height:46px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let L = "ru";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

const card = r =>
  `<figure class="item ${r.o === "h" ? "h" : "v"}">
    <div class="frame" role="button" tabindex="0" aria-label="${esc(r.who)}">
      <video src="videos/${esc(r.f)}.mp4" poster="videos/${esc(r.f)}.jpg" muted loop playsinline preload="none"></video>
      <span class="snd"></span>
    </div>
    <figcaption>${esc(r.who)}${r.lang ? ` <span>· ${esc(r.lang)}</span>` : ""}</figcaption>
  </figure>`;

document.getElementById("strip-v").innerHTML = REELS.filter(r => r.o !== "h").map(card).join("");
document.getElementById("strip-h").innerHTML = REELS.filter(r => r.o === "h").map(card).join("");

const vids = [...document.querySelectorAll(".strip video")];
const sndLabel = () => vids.forEach(v => v.nextElementSibling.textContent = v.muted ? T[L].sOff : T[L].sOn);
const vio = "IntersectionObserver" in window ? new IntersectionObserver(es => {
  es.forEach(e => {
    const v = e.target;
    if (e.isIntersecting && (!reduce || !v.muted)) v.play().catch(() => {});
    else if (!e.isIntersecting) v.pause();
  });
}, {threshold: .6}) : null;
if (vio) vids.forEach(v => vio.observe(v));

function toggle(frame) {
  const v = frame.querySelector("video");
  const turnOn = v.muted;
  vids.forEach(x => { x.muted = true; });
  v.muted = !turnOn;
  v.play().catch(() => {});
  sndLabel();
}

const sros = [];
document.querySelectorAll(".fmt").forEach(box => {
  const strip = box.querySelector(".strip");
  const prev = box.querySelector(".prev"), next = box.querySelector(".next");
  const items = [...strip.children];
  const go = dir => {
    const x = strip.scrollLeft, s0 = strip.getBoundingClientRect().left, cw = strip.clientWidth;
    const pos = items.map(it => it.getBoundingClientRect().left - s0 + x);
    let target;
    if (dir > 0) { const i = items.findIndex((it, k) => pos[k] + it.offsetWidth > x + cw + 8); target = i > -1 ? Math.max(pos[i], pos.find(p => p > x + 8)) : null; }
    else { target = pos.find(p => p >= x - cw - 8); if (target >= x - 8) target = [...pos].reverse().find(p => p < x - 8); }
    if (target == null) target = dir > 0 ? strip.scrollWidth : 0;
    strip.scrollTo({left: target, behavior: reduce ? "auto" : "smooth"});
  };
  const arrows = () => {
    prev.disabled = strip.scrollLeft < 8;
    next.disabled = strip.scrollLeft + strip.clientWidth > strip.scrollWidth - 8;
  };
  prev.addEventListener("click", () => go(-1));
  next.addEventListener("click", () => go(1));
  strip.addEventListener("scroll", arrows, {passive: true});
  strip.addEventListener("click", e => { const f = e.target.closest(".frame"); if (f) toggle(f); });
  strip.addEventListener("keydown", e => {
    const f = e.target.closest(".frame");
    if (f && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); toggle(f); }
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
  });
  const ro = new ResizeObserver(arrows); ro.observe(strip); sros.push(ro);
  arrows();
});

const waLink = () => "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(T[L].wa);
const contacts = () => [
  {k: 0, href: waLink(), show: CONFIG.whatsapp && CONFIG.whatsappShow},
  {k: 1, href: "https://t.me/" + CONFIG.telegram, show: CONFIG.telegram && "@" + CONFIG.telegram},
  {k: 2, href: "mailto:" + CONFIG.email, show: CONFIG.email},
  {k: 3, href: CONFIG.linkedin, show: CONFIG.linkedin.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "")}
].filter(c => c.show);

function setLang(l) {
  if (!T[l]) l = "ru";
  L = l;
  const d = T[l];
  document.documentElement.lang = l;
  document.querySelectorAll("[data-t]").forEach(el => { if (d[el.dataset.t] != null) el.textContent = d[el.dataset.t]; });
  document.getElementById("wa-hero").href = waLink();
  document.getElementById("svc").innerHTML = d.svc.map(s => `<div class="tile"><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");
  document.getElementById("rules").innerHTML = d.rules.map(r => `<li>${esc(r)}</li>`).join("");
  document.getElementById("cases").innerHTML = d.cases.map(c => `<article class="case">
      <div><h3>${esc(c.t)}</h3><div class="who">${esc(c.who)}</div><div class="tags">${c.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div></div>
      <p>${esc(c.p)}</p>
      <ul class="res">${c.res.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    </article>`).join("");
  document.getElementById("clist").innerHTML = contacts().map(c =>
    `<a href="${esc(c.href)}" target="_blank" rel="noopener"><b>${esc(d.cl[c.k])}</b><span>${esc(c.show)}</span></a>`).join("");
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === l)));
  document.title = d.name + " · " + d.role;
  sndLabel();
  try { localStorage.setItem("lang", l); } catch (e) {}
}

document.querySelector(".langs").addEventListener("click", e => {
  const b = e.target.closest("button[data-l]");
  if (!b) return;
  setLang(b.dataset.l);
  try { const u = new URL(location.href); u.searchParams.set("lang", b.dataset.l); history.replaceState(null, "", u); } catch (e) {}
});

let start = null;
try { start = new URLSearchParams(location.search).get("lang"); } catch (e) {}
const h = location.hash.slice(1);
if (!start && T[h]) start = h;
if (!start) { try { start = localStorage.getItem("lang"); } catch (e) {} }
if (!start) { const n = (navigator.language || "ru").slice(0, 2); start = T[n] ? n : "en"; }
setLang(start);
}
